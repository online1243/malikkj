<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apna 11 Top Bar</title>
<style>
  :root{
    --bar-height: 60px;
    --bg-grad: linear-gradient(90deg,#0f172a 0%, #0b5078 100%);
    --glass: rgba(255,255,255,0.06);
  }

  body{ margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#0f172a; color:#fff; min-height:200vh; }

  /* Top bar */
  .topbar{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: var(--bar-height);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 18px;
    gap:12px;
    backdrop-filter: blur(6px);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border-bottom: 1px solid rgba(255,255,255,0.04);
    z-index: 9999;
  }

  /* Brand group */
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand svg{ display:block; width:42px; height:42px; flex:0 0 42px; }
  .brand .title{
    display:flex;
    flex-direction:column;
    line-height:1;
    user-select:none;
  }
  .brand .title .name{
    font-weight:700;
    font-size:18px;
    letter-spacing:0.3px;
  }
  .brand .title .tag{
    font-size:12px;
    opacity:0.75;
    margin-top:2px;
  }

  /* Right actions */
  .actions{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .login-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-radius:10px;
    font-weight:600;
    text-decoration:none;
    color: #e6f7ff;
    background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.06);
    box-shadow: 0 4px 18px rgba(2,6,23,0.45);
    transition: transform .12s ease, opacity .12s ease;
  }
  .login-btn:hover{ transform: translateY(-2px); opacity:0.98; }

  /* Mobile: collapse text slightly */
  @media (max-width:520px){
    .brand .title .name{ font-size:16px; }
    .brand .title .tag{ display:none; }
    .login-btn{ padding:7px 10px; font-size:14px; border-radius:8px; }
  }

  /* Add some page padding so content doesn't hide under bar */
  main{ padding-top: calc(var(--bar-height) + 12px); }
</style>
</head>
<body>

<header class="topbar" role="banner" aria-label="Top navigation bar">
  <!-- Left: SVG logo + brand -->
  <div class="brand" aria-hidden="false">
    <!-- Simple SVG emblem for "apna 11" -->
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0" stop-color="#ffb86b"/>
          <stop offset="1" stop-color="#ff6a95"/>
        </linearGradient>
      </defs>

      <!-- circular badge -->
      <circle cx="50" cy="50" r="48" fill="url(#g)" />
      <!-- subtle inner ring -->
      <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,0.06)"/>
      <!-- "A" stylized -->
      <g transform="translate(50,50) scale(0.8) translate(-0,-4)" fill="#fff" font-family="sans-serif" text-anchor="middle">
        <text x="0" y="-8" font-size="28" font-weight="700">apna</text>
        <text x="0" y="24" font-size="34" font-weight="800">11</text>
      </g>
    </svg>

    <div class="title">
      <div class="name">apna 11</div>
      <div class="tag">{Mybrand}</div>
    </div>
  </div>

  <!-- Right: actions -->
  <div class="actions">
    <a class="login-btn" href="#login" role="button" aria-label="Login or Sign up">+ Login/sinup</a>
  </div>
</header>

<main>
  <section style="padding:20px; color:#d1e9ff;">
    <h1>Demo page content</h1>
    <p>Yahan se page content scroll karega — top bar hamesha fixed rahega.</p>
    <p>Example: change the brand text, tweak colors, ya SVG ko apne logo se replace kar le.</p>
  </section>
</main>

</body>
</html>
